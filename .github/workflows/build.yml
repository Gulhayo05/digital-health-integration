name: Build and Check IG QA

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Jekyll
        run: sudo gem install jekyll

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o input-cache/publisher.jar

      - name: Run IG Publisher
        run: java -Xmx6g -jar input-cache/publisher.jar -ig ig.ini

      # Faqat QA va asosiy sahifalarni ajratib olish
      - name: Prepare QA files
        run: |
          mkdir -p qa-artifacts
          cp output/qa.html qa-artifacts/ || true
          cp output/qa.txt qa-artifacts/ || true
          cp output/qa.min.html qa-artifacts/ || true
          cp output/index.html qa-artifacts/ || true
          cp -r output/assets qa-artifacts/ 2>/dev/null || true

      # Yengil artifact sifatida yuklash
      - name: Upload QA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ig-qa-report-${{ github.ref_name }}
          path: qa-artifacts/
          retention-days: 3